# Hermes Agent Dashboard on port 9119 (HTTPS SSL)
server {
    listen 9119 ssl;
    listen [::]:9119 ssl;
    server_name techstarz101.com www.techstarz101.com 2.25.238.185 hermes.techstarz101.com;

    ssl_certificate /etc/letsencrypt/live/techstarz101.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techstarz101.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 497 =301 https://$host:9119$request_uri;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:9118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Twenty CRM Suite on port 3000 (HTTPS SSL)
server {
    listen 3000 ssl;
    listen [::]:3000 ssl;
    server_name techstarz101.com www.techstarz101.com 2.25.238.185;

    ssl_certificate /etc/letsencrypt/live/techstarz101.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techstarz101.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 497 =301 https://$host:3000$request_uri;
    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3000;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

