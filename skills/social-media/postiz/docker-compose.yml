services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: techstarz101-postiz
    restart: always
    env_file:
      - .env
    environment:
      MAIN_URL: "${MAIN_URL:-http://localhost:5000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5000}"
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000/api}"
      DATABASE_URL: "postgresql://postiz-user:${POSTGRES_PASSWORD:-postiz_sovereign_pw}@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "${DISABLE_REGISTRATION:-false}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      RUN_CRON: "true"
      API_LIMIT: "300"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - "5000:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: techstarz101-postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postiz_sovereign_pw}"
      POSTGRES_USER: "postiz-user"
      POSTGRES_DB: "postiz-db-local"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: techstarz101-postiz-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postiz-redis-data:/data

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:

