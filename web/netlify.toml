# Netlify Configuration for Hermes Agent Dashboard (web directory)

[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback Redirect for React Router client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Static Asset Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
