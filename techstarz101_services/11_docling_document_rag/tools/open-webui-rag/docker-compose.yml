services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ts101_s11_open_webui_rag
    restart: unless-stopped
    ports:
      - "6820:8080"
    environment:
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://host.docker.internal:6700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui_rag_data:/app/backend/data
volumes:
  openwebui_rag_data:
