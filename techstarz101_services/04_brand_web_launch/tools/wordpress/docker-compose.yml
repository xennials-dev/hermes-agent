# WordPress — open-source visual site builder (Stack B)
# Upstream: https://github.com/WordPress/WordPress
# Local URL: http://localhost:5600
name: ts101-wordpress

services:
  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    ports:
      - "5600:80"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?run the hub once to generate .env}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html
    depends_on:
      wp-db:
        condition: service_healthy

  wp-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - wp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  wp-data:
  wp-db:
