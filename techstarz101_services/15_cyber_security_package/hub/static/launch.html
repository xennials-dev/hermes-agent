<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launching Tool — Techstarz101 Cyber Security Package</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-2xl w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <div id="toolIcon" class="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center text-3xl">🛡️</div>
        <div>
          <p class="text-xs uppercase tracking-widest text-rose-400 font-semibold">Techstarz101 · Standalone Tool Launcher</p>
          <h1 id="toolName" class="text-2xl font-bold text-white">Loading…</h1>
          <p id="toolRole" class="text-sm text-slate-400"></p>
        </div>
      </div>
      <a href="/" class="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">← Hub</a>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 mb-5">
      <div class="flex items-center justify-between text-xs mb-2">
        <span class="text-slate-400">Status</span>
        <span id="statusBadge" class="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-semibold">Initializing…</span>
      </div>
      <div id="firstRun" class="text-xs text-slate-400 mt-1"></div>
    </div>

    <pre id="logs" class="bg-black/70 border border-slate-800 rounded-xl p-4 text-xs text-emerald-300 font-mono h-56 overflow-y-auto whitespace-pre-wrap mb-5">Connecting to Modular Hub…</pre>

    <div class="flex flex-wrap gap-3">
      <a id="openBtn" href="#" target="_blank" class="hidden flex-1 text-center px-4 py-3 rounded-xl bg-rose-500 hover:bg-rose-400 text-white font-bold text-sm">Open Running Application →</a>
      <button id="retryBtn" onclick="startTool()" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold">Restart Boot</button>
      <a id="repoBtn" href="#" target="_blank" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm">GitHub Repo ↗</a>
    </div>
  </div>

  <script>
    const TOOL_ID = "__TOOL_ID__";
    let toolMeta = null;
    let redirected = false;

    async function init() {
      const reg = await (await fetch("/api/registry")).json();
      toolMeta = reg.tools[TOOL_ID];
      document.title = `Launching ${toolMeta.name} — Techstarz101`;
      document.getElementById("toolIcon").textContent = toolMeta.icon;
      document.getElementById("toolName").textContent = toolMeta.name;
      document.getElementById("toolRole").textContent = toolMeta.role;
      document.getElementById("firstRun").textContent = toolMeta.first_run;
      document.getElementById("repoBtn").href = toolMeta.repo;
      document.getElementById("openBtn").href = toolMeta.url;
      await startTool();
      setInterval(poll, 1800);
      poll();
    }

    async function startTool() {
      await fetch(`/api/tools/${TOOL_ID}/start`, { method: "POST" });
    }

    async function poll() {
      const st = await (await fetch("/api/status")).json();
      const t = st.tools[TOOL_ID];
      const badge = document.getElementById("statusBadge");
      const logsEl = document.getElementById("logs");
      if (t.logs && t.logs.length) {
        logsEl.textContent = t.logs.join("\n");
        logsEl.scrollTop = logsEl.scrollHeight;
      }
      if (t.up) {
        badge.textContent = "LIVE · Redirecting…";
        badge.className = "px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold";
        document.getElementById("openBtn").classList.remove("hidden");
        if (!redirected) {
          redirected = true;
          setTimeout(() => { window.location.href = t.url; }, 900);
        }
      } else if (!st.docker_ready) {
        badge.textContent = "Docker Desktop Stopped";
        badge.className = "px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 font-semibold";
      } else if (t.state === "error") {
        badge.textContent = "Boot Error";
        badge.className = "px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 font-semibold";
      } else {
        badge.textContent = "Booting Container…";
      }
    }
    init();
  </script>
</body>
</html>
