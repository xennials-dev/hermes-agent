# Metabase — executive ROAS, CAC & A/B campaign BI dashboards (Stack B)
# Upstream: https://github.com/metabase/metabase
# Local URL: http://localhost:5430
name: ts101-metabase

services:
  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?run the hub once to generate .env}
      MB_DB_HOST: metabase-db
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY}
    ports:
      - "5430:3000"
    depends_on:
      metabase-db:
        condition: service_healthy

  metabase-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  metabase-db:
