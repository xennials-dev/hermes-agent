# Langfuse — AI Employee Observability & Audit Traces (Stack A)
# Upstream: https://github.com/langfuse/langfuse
# Local URL: http://localhost:5730
name: ts101-langfuse

services:
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "5730:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?run the hub once to generate .env}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:5730
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  langfuse-db:
