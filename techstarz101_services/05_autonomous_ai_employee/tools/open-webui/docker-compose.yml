# Open WebUI — Executive AI Command Center (Stack A)
# Upstream: https://github.com/open-webui/open-webui
# Local URL: http://localhost:5700
name: ts101-open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "5700:8080"
    environment:
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET:?run the hub once to generate .env}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-exec:/app/backend/data

volumes:
  open-webui-exec:
