# Grist — Relational Spreadsheet & SaaS-Savings ROI Modeler (Stack B)
# Upstream: https://github.com/gristlabs/grist-core
# Local URL: http://localhost:6010
name: ts101-grist

services:
  grist:
    image: gristlabs/grist:latest
    restart: unless-stopped
    ports:
      - "6010:8484"
    environment:
      PORT: "8484"
      APP_HOME_URL: http://localhost:6010
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET:?run the hub once to generate .env}
      GRIST_DEFAULT_EMAIL: admin@techstarz101.local
    volumes:
      - grist-data:/persist

volumes:
  grist-data:
