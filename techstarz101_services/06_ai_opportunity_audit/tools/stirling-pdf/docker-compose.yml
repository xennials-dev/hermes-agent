# Stirling-PDF — Executive Audit PDF Compiler & Watermarker (Stack B)
# Upstream: https://github.com/Stirling-Tools/Stirling-PDF
# Local URL: http://localhost:6020
name: ts101-stirling-pdf

services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    restart: unless-stopped
    ports:
      - "6020:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
    volumes:
      - stirling-configs:/configs

volumes:
  stirling-configs:
