server {
    listen 80;
    listen [::]:80;
    server_name
        workstation.2-25-238-185.sslip.io
        n8n.workstation.2-25-238-185.sslip.io
        crm.workstation.2-25-238-185.sslip.io
        shlink.workstation.2-25-238-185.sslip.io
        cyberchef.workstation.2-25-238-185.sslip.io
        adminer.workstation.2-25-238-185.sslip.io
        mailpit.workstation.2-25-238-185.sslip.io
        vaultwarden.workstation.2-25-238-185.sslip.io
        excalidraw.workstation.2-25-238-185.sslip.io
        uptime-kuma.workstation.2-25-238-185.sslip.io
        nocodb.workstation.2-25-238-185.sslip.io
        *.workstation.2-25-238-185.sslip.io
        workstation.techstarz101.com
        *.workstation.techstarz101.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://$workstation_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
