<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launching Service Hub — Techstarz101 Master Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-lg w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-5">
    <div id="svcIcon" class="w-16 h-16 mx-auto rounded-2xl bg-cyan-500/15 border border-cyan-500/30 flex items-center justify-center text-4xl">🚀</div>
    <div>
      <p id="svcId" class="text-xs uppercase tracking-widest text-cyan-400 font-bold">Techstarz101 Service Hub</p>
      <h1 id="svcName" class="text-2xl font-extrabold text-white mt-1">Starting Service…</h1>
      <p id="svcTag" class="text-xs text-slate-400 mt-1"></p>
    </div>
    <div id="badge" class="inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300">Booting Hub Process…</div>
    <div class="flex gap-3 justify-center pt-2">
      <a href="/" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">← Master Portal</a>
      <a id="openLink" href="#" class="hidden px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold">Open Hub Now →</a>
    </div>
  </div>
  <script>
    const BASE = window.location.pathname.startsWith("/workstation") ? "/workstation" : "";
    const NUM = "__SVC_NUM__";
    let targetUrl = "";
    let done = false;

    async function init() {
      const cat = await (await fetch(`${BASE}/api/portal/catalog`)).json();
      const svc = cat.services.find(s => s.num === NUM);
      document.title = `Launching ${svc.name} — Techstarz101`;
      document.getElementById("svcIcon").textContent = svc.icon;
      document.getElementById("svcId").textContent = `${svc.id} · PORT :${svc.port}`;
      document.getElementById("svcName").textContent = svc.name;
      document.getElementById("svcTag").textContent = svc.tagline;
      targetUrl = svc.external ? svc.url : `http://2.25.238.185:${svc.port}`;
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        targetUrl = svc.external ? svc.url : `http://localhost:${svc.port}`;
      }
      document.getElementById("openLink").href = targetUrl;

      if (svc.external) {
        window.location.href = targetUrl;
        return;
      }
      await fetch(`${BASE}/api/portal/service/${NUM}/start`, { method: "POST" });
      setInterval(poll, 1000);
      poll();
    }

    async function poll() {
      const st = await (await fetch(`${BASE}/api/portal/status`)).json();
      if (st.services[NUM] && st.services[NUM].up) {
        const b = document.getElementById("badge");
        b.textContent = "LIVE · Redirecting…";
        b.className = "inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300";
        document.getElementById("openLink").classList.remove("hidden");
        if (!done) {
          done = true;
          setTimeout(() => { window.location.href = targetUrl; }, 600);
        }
      }
    }
    init();
  </script>
</body>
</html>
