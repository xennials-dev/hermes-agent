<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launching __TOOL_NAME__ · Techstarz101</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a13;color:#e2e8f0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{width:min(720px,92vw);background:#0d1322;border:1px solid #1e293b;border-radius:18px;padding:32px}
  .icon{font-size:56px}
  h1{margin:8px 0 4px;font-size:28px}
  .muted{color:#94a3b8;font-size:14px}
  .bar{height:8px;background:#1e293b;border-radius:99px;overflow:hidden;margin:22px 0 10px}
  .bar>div{height:100%;width:8%;background:linear-gradient(90deg,#38bdf8,#818cf8);transition:width .6s}
  pre{background:#050811;border:1px solid #1e293b;border-radius:10px;padding:12px;height:220px;overflow:auto;font-size:12px;color:#94a3b8;white-space:pre-wrap}
  a.btn{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:10px;background:#38bdf8;color:#04121f;font-weight:700;text-decoration:none}
  .phase{font-weight:700;color:#38bdf8}
  .err{color:#fb7185}
</style>
</head>
<body>
<div class="card">
  <div class="icon">__TOOL_ICON__</div>
  <h1>__TOOL_NAME__</h1>
  <div class="muted">Dedicated link · <code>/t/__TOOL_ID__</code> → <code>__TOOL_URL__</code></div>
  <div class="bar"><div id="bar"></div></div>
  <div>Status: <span class="phase" id="phase">checking…</span> <span class="err" id="err"></span></div>
  <div class="muted" id="hint">First launch pulls the Docker images, which can take several minutes. You'll be redirected automatically.</div>
  <pre id="log"></pre>
  <a class="btn" href="__TOOL_URL__" id="open">Open __TOOL_NAME__ now</a>
  <a class="btn" href="/" style="background:#1e293b;color:#e2e8f0">← Back to hub</a>
</div>
<script>
const TID = "__TOOL_ID__", URL_ = "__TOOL_URL__";
const widths = {stopped: 5, idle: 5, pulling: 35, booting: 75, running: 100, error: 100};
let kicked = false;
async function tick() {
  try {
    const s = await (await fetch('/api/status')).json();
    const t = s.tools[TID];
    if (!s.docker_ready) {
      document.getElementById('phase').textContent = 'waiting for Docker';
      document.getElementById('err').textContent = 'Docker engine not running – starting Docker Desktop…';
      if (!kicked) { kicked = true; fetch('/api/docker/start', {method: 'POST'}); }
      return setTimeout(tick, 5000);
    }
    document.getElementById('err').textContent = t.error || '';
    if (t.phase === 'running') {
      document.getElementById('phase').textContent = 'running – redirecting';
      document.getElementById('bar').style.width = '100%';
      return setTimeout(() => location.href = URL_, 900);
    }
    if ((t.phase === 'stopped' || t.phase === 'idle') && !window.__started) {
      window.__started = true;
      await fetch(`/api/tools/${TID}/start`, {method: 'POST'});
    }
    document.getElementById('phase').textContent = t.phase;
    document.getElementById('bar').style.width = (widths[t.phase] || 20) + '%';
    const l = await (await fetch(`/api/tools/${TID}/logs`)).json();
    const pre = document.getElementById('log');
    pre.textContent = l.hub.join('\n');
    pre.scrollTop = pre.scrollHeight;
    if (t.phase === 'error') return;
  } catch (e) { document.getElementById('err').textContent = String(e); }
  setTimeout(tick, 3000);
}
tick();
</script>
</body>
</html>
