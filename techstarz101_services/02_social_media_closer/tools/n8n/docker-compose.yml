# n8n — workflow automation glue (Stack A)
# Upstream: https://github.com/n8n-io/n8n
# Local URL: http://localhost:5120
name: ts101-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5120/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run the hub once to generate .env}
      GENERIC_TIMEZONE: America/Chicago
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "5120:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../../automations:/automations:ro

volumes:
  n8n-data:

