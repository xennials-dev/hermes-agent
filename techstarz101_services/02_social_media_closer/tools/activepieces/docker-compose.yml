# Activepieces — no-code automation (Stack B)
# Upstream: https://github.com/activepieces/activepieces
# Local URL: http://localhost:5220
name: ts101-activepieces

services:
  activepieces:
    image: ghcr.io/activepieces/activepieces:latest
    restart: unless-stopped
    environment:
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: http://localhost:5220
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_API_KEY: ${AP_API_KEY:?run the hub once to generate .env}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: ap-postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: ${AP_DB_PASSWORD}
      AP_REDIS_HOST: ap-redis
      AP_REDIS_PORT: "6379"
      AP_TELEMETRY_ENABLED: "false"
      AP_TEMPLATES_SOURCE_URL: https://cloud.activepieces.com/api/v1/flow-templates
    ports:
      - "5220:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ap-cache:/usr/src/app/cache
    depends_on:
      ap-postgres:
        condition: service_healthy
      ap-redis:
        condition: service_healthy

  ap-postgres:
    image: postgres:14.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AP_DB_PASSWORD}
    volumes:
      - ap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activepieces"]
      interval: 5s
      timeout: 5s
      retries: 20

  ap-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ap-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ap-cache:
  ap-postgres:
  ap-redis:

