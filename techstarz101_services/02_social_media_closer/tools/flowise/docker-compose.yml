# Flowise — visual AI agent builder for the DM closer bot (Stack B)
# Upstream: https://github.com/FlowiseAI/Flowise
# Local URL: http://localhost:5210
name: ts101-flowise

services:
  flowise:
    image: flowiseai/flowise:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRETKEY:?run the hub once to generate .env}
      DISABLE_FLOWISE_TELEMETRY: "true"
    ports:
      - "5210:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - flowise-data:/root/.flowise
      - ../../automations:/automations:ro

volumes:
  flowise-data:

