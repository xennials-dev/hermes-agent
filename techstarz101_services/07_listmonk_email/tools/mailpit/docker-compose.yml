# Mailpit — Pre-Send Email HTML QA & SMTP Sandbox (Stack A)
# Upstream: https://github.com/axllent/mailpit
# Local Web UI: http://localhost:6120 (SMTP Capture :1025)
name: ts101-mailpit

services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "6120:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
