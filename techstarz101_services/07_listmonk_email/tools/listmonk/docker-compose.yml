# Listmonk — Zero-Contact-Tax Email Engine (Stack A)
# Upstream: https://github.com/knadh/listmonk
# Local URL: http://localhost:6100
name: ts101-listmonk-s07

services:
  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    ports:
      - "6100:9000"
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_app__admin_username: admin
      LISTMONK_app__admin_password: ${LISTMONK_ADMIN_PASSWORD:?run the hub once to generate .env}
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__ssl_mode: disable
    command: ["/bin/sh", "-c", "./listmonk --install --idempotent --yes && ./listmonk --upgrade --yes && ./listmonk"]
    depends_on:
      listmonk-db:
        condition: service_healthy

  listmonk-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
    volumes:
      - listmonk-s07-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  listmonk-s07-db:
