version: '3.8'

services:
  lead-generator-api:
    image: python:3.12-slim
    container_name: ts101-lead-generator
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "${SERVICE_PORT:-7865}:7865"
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-techstarz_leads}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - REDIS_URL=redis://redis:6379/0
      - TWENTY_GRAPHQL_ENDPOINT=${TWENTY_GRAPHQL_ENDPOINT:-http://host.docker.internal:3002/graphql}
      - CALCOM_EVENT_SLUG=${CALCOM_EVENT_SLUG:-techstarz101/audit}
    command: >
      sh -c "pip install --no-cache-dir gradio httpx pydantic pandas uvicorn fastapi && python app.py --host 0.0.0.0 --port 7865"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - techstarz-net

  postgres:
    image: postgres:16-alpine
    container_name: ts101-leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techstarz_leads}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - techstarz-net

  redis:
    image: redis:7-alpine
    container_name: ts101-leads-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - techstarz-net

volumes:
  postgres_data:
  redis_data:

networks:
  techstarz-net:
    driver: bridge
