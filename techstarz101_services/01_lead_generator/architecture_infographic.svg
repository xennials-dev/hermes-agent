<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#070a13; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- Subtle Radial Background Accents -->
  <circle cx="200" cy="150" r="280" fill="#38bdf8" opacity="0.05" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="320" fill="#818cf8" opacity="0.05" filter="url(#glow)" />

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="28" y="19" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">TECHSTARZ101 · SERVICE #01</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Autonomous Lead Generator &amp; Auto-Booker
    </text>
    <text x="0" y="94" fill="#94a3b8" font-size="15" font-weight="400">
      Self-hosted, zero-tax B2B pipeline enriching 250+ verified ICP decision-makers in &lt;60s
    </text>

    <!-- Top Badges -->
    <g transform="translate(740, 10)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="url(#badgeGrad)" />
      <text x="80" y="22" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">⚡ SLA &lt; 60 SECONDS</text>

      <rect x="175" y="0" width="155" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="252" y="22" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">🎯 250+ ICP LEADS</text>
    </g>
  </g>

  <!-- 4-Stage Bento Flow -->
  <g transform="translate(60, 175)">
    
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="270" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2" />
      <text x="38" y="44" fill="#38bdf8" font-size="18" font-weight="800" text-anchor="middle">1</text>
      <text x="68" y="42" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">&lt; 20s LATENCY</text>
      
      <text x="20" y="85" fill="#f8fafc" font-size="18" font-weight="700">Target Discovery</text>
      <text x="20" y="108" fill="#94a3b8" font-size="13">High-throughput scraping of local/niche directories</text>
      
      <line x1="20" y1="125" x2="230" y2="125" stroke="#334155" stroke-width="1" />
      
      <text x="20" y="152" fill="#e2e8f0" font-size="12" font-weight="600">Core Engines:</text>
      <text x="20" y="176" fill="#cbd5e1" font-size="13">• Crawl4AI (LLM Scraper)</text>
      <text x="20" y="200" fill="#cbd5e1" font-size="13">• SearXNG Metasearch</text>
      <text x="20" y="224" fill="#cbd5e1" font-size="13">• Playwright Chromium</text>
      <text x="20" y="248" fill="#10b981" font-size="11" font-weight="700">✓ 16 Concurrency Pool</text>
    </g>

    <!-- Flow Arrow 1-2 -->
    <path d="M 255 135 L 275 135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Stage 2 -->
    <g transform="translate(275, 0)">
      <rect width="250" height="270" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#818cf8" fill-opacity="0.2" />
      <text x="38" y="44" fill="#818cf8" font-size="18" font-weight="800" text-anchor="middle">2</text>
      <text x="68" y="42" fill="#818cf8" font-size="12" font-weight="700" letter-spacing="1">&lt; 15s LATENCY</text>
      
      <text x="20" y="85" fill="#f8fafc" font-size="18" font-weight="700">Multi-Vector Check</text>
      <text x="20" y="108" fill="#94a3b8" font-size="13">DNS, MX record &amp; SMTP deliverability verification</text>
      
      <line x1="20" y1="125" x2="230" y2="125" stroke="#334155" stroke-width="1" />
      
      <text x="20" y="152" fill="#e2e8f0" font-size="12" font-weight="600">Verification Engine:</text>
      <text x="20" y="176" fill="#cbd5e1" font-size="13">• Truemail RFC Validation</text>
      <text x="20" y="200" fill="#cbd5e1" font-size="13">• Mock SMTP Handshake</text>
      <text x="20" y="224" fill="#cbd5e1" font-size="13">• Redis DNS Caching</text>
      <text x="20" y="248" fill="#10b981" font-size="11" font-weight="700">✓ 98.4% Deliverable Rate</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(550, 0)">
      <rect width="250" height="270" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#f43f5e" fill-opacity="0.2" />
      <text x="38" y="44" fill="#f43f5e" font-size="18" font-weight="800" text-anchor="middle">3</text>
      <text x="68" y="42" fill="#f43f5e" font-size="12" font-weight="700" letter-spacing="1">&lt; 15s LATENCY</text>
      
      <text x="20" y="85" fill="#f8fafc" font-size="18" font-weight="700">Semantic AI Hooks</text>
      <text x="20" y="108" fill="#94a3b8" font-size="13">Local LLM reads value prop &amp; crafts custom hook</text>
      
      <line x1="20" y1="125" x2="230" y2="125" stroke="#334155" stroke-width="1" />
      
      <text x="20" y="152" fill="#e2e8f0" font-size="12" font-weight="600">Intelligence Layer:</text>
      <text x="20" y="176" fill="#cbd5e1" font-size="13">• Ollama / Nemotron Mini</text>
      <text x="20" y="200" fill="#cbd5e1" font-size="13">• Instructor Pydantic</text>
      <text x="20" y="224" fill="#cbd5e1" font-size="13">• 1-Sentence Pitch Synthesis</text>
      <text x="20" y="248" fill="#10b981" font-size="11" font-weight="700">✓ Zero Hallucination Guard</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="270" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" />
      <text x="38" y="44" fill="#10b981" font-size="18" font-weight="800" text-anchor="middle">4</text>
      <text x="68" y="42" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1">&lt; 10s LATENCY</text>
      
      <text x="20" y="85" fill="#f8fafc" font-size="18" font-weight="700">CRM Sync &amp; Book</text>
      <text x="20" y="108" fill="#94a3b8" font-size="13">GraphQL batch insert &amp; Cal.com calendar injection</text>
      
      <line x1="20" y1="125" x2="235" y2="125" stroke="#334155" stroke-width="1" />
      
      <text x="20" y="152" fill="#e2e8f0" font-size="12" font-weight="600">Sovereign Endpoints:</text>
      <text x="20" y="176" fill="#cbd5e1" font-size="13">• Twenty CRM GraphQL</text>
      <text x="20" y="200" fill="#cbd5e1" font-size="13">• Cal.com Automated Invites</text>
      <text x="20" y="224" fill="#cbd5e1" font-size="13">• Instant CSV / Excel Export</text>
      <text x="20" y="248" fill="#10b981" font-size="11" font-weight="700">✓ Full Pipeline Complete</text>
    </g>
  </g>

  <!-- Bottom Comparison Strip -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="150" rx="14" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
    
    <text x="30" y="38" fill="#ffffff" font-size="16" font-weight="700">ARCHITECTURAL IMPLEMENTATION STACKS (100% OPEN SOURCE)</text>
    
    <!-- Stack A Column -->
    <g transform="translate(30, 55)">
      <rect width="490" height="75" rx="8" fill="#131d33" stroke="#2563eb" stroke-width="1" />
      <text x="16" y="25" fill="#60a5fa" font-size="13" font-weight="800">STACK A: High-Throughput Sovereign Pipeline</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">Crawl4AI + n8n + Truemail + Twenty CRM + Cal.com</text>
      <text x="16" y="64" fill="#cbd5e1" font-size="11">Best for: Daily high-volume SDR batches, automated CRM sync</text>
    </g>

    <!-- Stack B Column -->
    <g transform="translate(560, 55)">
      <rect width="490" height="75" rx="8" fill="#131d33" stroke="#a855f7" stroke-width="1" />
      <text x="16" y="25" fill="#c084fc" font-size="13" font-weight="800">STACK B: Agentic Autonomous Swarm</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">Hermes Agent + Browser-Use + DuckDB + Shlink + Typebot</text>
      <text x="16" y="64" fill="#cbd5e1" font-size="11">Best for: Complex web portals, zero-API interactive forms</text>
    </g>
  </g>
</svg>
