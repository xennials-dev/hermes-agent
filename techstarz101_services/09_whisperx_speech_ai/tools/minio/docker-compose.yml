# MinIO — S3-Compatible Audio & Transcript Vault (Stack A)
# Upstream: https://github.com/minio/minio
# Local Console: http://localhost:6320 (S3 API: http://localhost:6321)
name: ts101-minio

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "6321:9000"
      - "6320:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run the hub once to generate .env}
    volumes:
      - minio-audio:/data

volumes:
  minio-audio:
