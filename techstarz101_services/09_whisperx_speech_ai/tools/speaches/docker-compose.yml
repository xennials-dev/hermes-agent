# Speaches — OpenAI-Compatible Faster-Whisper Speech API (Stack A)
# Upstream: https://github.com/speaches-ai/speaches
# Local Swagger UI: http://localhost:6300/docs
name: ts101-speaches

services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    ports:
      - "6300:8000"
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__INFERENCE_DEVICE: cpu
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface

volumes:
  speaches-cache:
