services:
  db:
    image: postgres:16-alpine
    container_name: ts101_s14_langfuse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
  langfuse:
    image: langfuse/langfuse:2
    container_name: ts101_s14_langfuse_audit
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "7420:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      NEXTAUTH_URL: http://localhost:7420
