services:
  db:
    image: postgres:16-alpine
    container_name: ts101_s13_windmill_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: windmill
  windmill:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: ts101_s13_windmill
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "7210:8000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      MODE: standalone
